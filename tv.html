<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV — Festival de Inverno</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  .layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    -webkit-transition: opacity 1.5s ease-in-out;
  }
  .layer .bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-position: center; background-size: cover; background-repeat: no-repeat;
    -webkit-filter: blur(26px) brightness(0.5); filter: blur(26px) brightness(0.5);
    -webkit-transform: scale(1.18); transform: scale(1.18); /* esconde as bordas borradas */
    display: none;
  }
  .layer .pic {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-position: center; background-size: contain; background-repeat: no-repeat;
    -webkit-transform-origin: center center; transform-origin: center center;
  }
  .layer .pic.kb {
    -webkit-animation: kenburns 11500ms ease-out forwards;
    animation: kenburns 11500ms ease-out forwards;
  }
  @keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.13); } }
  @-webkit-keyframes kenburns { from { -webkit-transform: scale(1.04); } to { -webkit-transform: scale(1.13); } }
  .layer video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; background: #000; /* preenche a tela proporcionalmente */
  }
  .layer .handle {
    position: absolute; bottom: 76px; left: 0; width: 100%;
    text-align: center; color: #fff;
    font-family: 'Quicksand', Arial, Helvetica, sans-serif;
    font-size: 30px; font-weight: 600; letter-spacing: 0.5px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.95);
  }
  .visible { opacity: 1; }
  #brand {
    position: absolute; top: 24px; left: 30px; z-index: 10;
    text-align: center; pointer-events: none;
  }
  #brand img {
    display: block; width: 210px; opacity: 0.88; margin: 0 auto 8px;
  }
  #titulo {
    color: #fff; font-size: 30px; font-weight: bold;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    white-space: nowrap;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  #qr {
    position: absolute; top: 24px; right: 24px; z-index: 10;
    background: rgba(255,255,255,0.95); border-radius: 12px;
    padding: 10px; text-align: center;
  }
  #qrimg { display: block; width: 170px; height: 170px; }
  #qr div {
    font-size: 15px; color: #0b1b3a; margin-top: 6px;
    font-weight: bold; letter-spacing: 1px;
  }
  #msg {
    position: absolute; top: 50%; left: 0; width: 100%;
    text-align: center; color: #999; font-size: 28px; margin-top: -20px;
  }
  /* emojis como imagem (mesmo visual em qualquer TV) */
  img.emoji {
    height: 1.1em !important; width: 1.1em !important;
    margin: 0 0.15em; vertical-align: -0.15em;
    display: inline-block !important;
  }
  /* floco do título: um pouco menor e com respiro antes do texto */
  #titulo img.emoji {
    height: 0.85em !important; width: 0.85em !important;
    margin-right: 12px;
  }
  /* tela de início: 1 toque libera o áudio dos vídeos */
  #start {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
    background: #06122b; cursor: pointer; color: #fff; text-align: center;
    font-family: 'Quicksand', Arial, Helvetica, sans-serif;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  #startbox { font-size: 42px; line-height: 1.5; font-weight: 600; }
  #startbox small { font-size: 24px; opacity: 0.8; }
</style>
</head>
<body>
  <div id="layerA" class="layer"><div class="bg"></div><div class="pic"></div><video playsinline preload="auto"></video><div class="handle"></div></div>
  <div id="layerB" class="layer"><div class="bg"></div><div class="pic"></div><video playsinline preload="auto"></video><div class="handle"></div></div>
  <div id="brand">
    <img id="logomarca" src="logo-marca.png" alt="">
    <div id="titulo"></div>
  </div>
  <div id="qr"><img id="qrimg" alt="QR"><div>ENVIE SUA FOTO &#128247;</div></div>
  <div id="msg">Aguardando fotos...</div>
  <div id="start"><div id="startbox">&#9654;<br>Toque para iniciar<br><small>com som &#128266;</small></div></div>

<script src="config.js"></script>
<script>
  document.getElementById('titulo').innerHTML = '&#10052;&#65039; ' + TITULO;
  document.getElementById('qrimg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=460x460&data=' + encodeURIComponent(SITE_URL);

  // troca emojis por imagens (Twemoji) — mesmo visual em qualquer navegador/TV
  function emojiImg(el) {
    if (window.twemoji) {
      twemoji.parse(el, { folder: 'svg', ext: '.svg' });
    }
  }
  emojiImg(document.getElementById('titulo'));
  emojiImg(document.getElementById('qr'));

  var SEG_FOTO = SEGUNDOS_POR_FOTO * 1000;       // valor em segundos vem do config.js
  var SEG_ATUALIZA = INTERVALO_ATUALIZACAO * 1000; // valor em segundos vem do config.js
  var MAX_VIDEO = 60000; // segurança: vídeo nunca segura a tela mais que 60s

  var FOTOS_ENTRE_VIDEOS = (typeof FOTOS_POR_VIDEO !== 'undefined') ? FOTOS_POR_VIDEO : 10;

  var known = {};      // id -> {handle, video}
  var fotos = [];      // ids das fotos (mais novas primeiro) — espelha a pasta a cada varredura
  var videos = [];     // ids dos vídeos (mais novos primeiro) — incluir/excluir é automático
  var priority = [];   // fotos novas: passam na frente
  var indisponiveis = {}; // id -> timestamp até quando pular (ex.: Drive processando)
  var cacheVideos = {};   // id -> blob URL (cada vídeo baixa só 1 vez por sessão)
  var fotoIdx = 0;
  var videoIdx = 0;       // rotação sequencial dos vídeos
  var contadorFotos = 0;  // fotos exibidas desde o último vídeo
  var firstLoad = true;
  var iniciado = false;   // vira true após o toque inicial (libera áudio dos vídeos)
  var activeA = true;
  var avancarTimer = null;

  function disponivel(id) {
    return !(indisponiveis[id] && Date.now() < indisponiveis[id]);
  }

  function agendar(ms) {
    clearTimeout(avancarTimer);
    avancarTimer = setTimeout(showNext, ms);
  }

  function urlFoto(id) {
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1920';
  }

  // baixa a próxima foto da rotação enquanto a atual está na tela (transição sem buraco)
  function prefetchProximaFoto() {
    var ok = fotos.filter(disponivel);
    if (ok.length === 0) return;
    var prox = priority.length > 0 ? priority[0] : ok[fotoIdx % ok.length];
    if (prox) { var im = new Image(); im.src = urlFoto(prox); }
  }

  function urlVideo(id) {
    // o vídeo é entregue pela própria API (Apps Script), em base64
    return API_URL + '?video=' + id;
  }

  function onPhotos(lista) {
    var current = {};
    var novasFotos = [];
    var novosVideos = [];
    for (var i = 0; i < lista.length; i++) {
      var p = lista[i];
      current[p.id] = true;
      if (!(p.id in known)) {
        known[p.id] = { handle: p.handle || '', video: !!p.video };
        if (!firstLoad && !p.video) priority.push(p.id); // foto nova fura a fila
      }
      if (p.video) novosVideos.push(p.id);
      else novasFotos.push(p.id);
    }
    // as listas sempre espelham a pasta: incluir/excluir mídia vale na próxima varredura
    fotos = novasFotos;
    videos = novosVideos;
    priority = priority.filter(function (id) { return current[id]; });

    if (iniciado && firstLoad && (fotos.length > 0 || videos.length > 0)) {
      firstLoad = false;
      document.getElementById('msg').style.display = 'none';
      showNext();
    }

    prefetchVideos(); // baixa os vídeos em segundo plano para tocar sem pausas
  }

  // ===== Pré-carregamento dos vídeos (1 por vez, em segundo plano) =====
  var prefetchAtivo = false;
  function prefetchVideos() {
    if (prefetchAtivo) return;
    var faltando = videos.filter(function (id) { return !cacheVideos[id] && disponivel(id); });
    if (faltando.length === 0) return;
    prefetchAtivo = true;
    var id = faltando[0];
    var x = new XMLHttpRequest();
    x.open('GET', urlVideo(id));
    x.timeout = 60000;
    function proximo() {
      prefetchAtivo = false;
      setTimeout(prefetchVideos, 2000); // segue para o próximo vídeo que faltar
    }
    x.onload = function () {
      try {
        var r = JSON.parse(x.responseText);
        if (r.ok && r.data) {
          var bin = atob(r.data);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          cacheVideos[id] = URL.createObjectURL(new Blob([bytes], { type: r.mime || 'video/mp4' }));
        } else {
          indisponiveis[id] = Date.now() + 120000;
        }
      } catch (e) {
        indisponiveis[id] = Date.now() + 120000;
      }
      proximo();
    };
    x.onerror = function () { indisponiveis[id] = Date.now() + 120000; proximo(); };
    x.ontimeout = function () { indisponiveis[id] = Date.now() + 120000; proximo(); };
    x.send();
  }

  function showNext() {
    var videosOk = videos.filter(disponivel);
    var fotosOk = fotos.filter(disponivel);

    // hora do vídeo: após exibir as fotos disponíveis (até o máximo de FOTOS_ENTRE_VIDEOS),
    // ou quando não há fotos na pasta
    var limiteFotos = Math.min(FOTOS_ENTRE_VIDEOS, fotosOk.length || FOTOS_ENTRE_VIDEOS);
    if (videosOk.length > 0 && (contadorFotos >= limiteFotos || fotosOk.length === 0)) {
      contadorFotos = 0;
      var vid = videosOk[videoIdx % videosOk.length]; // rotação sequencial
      videoIdx++;
      mostrarVideo(vid, (known[vid] || {}).handle || '');
      return;
    }

    if (fotosOk.length === 0) { agendar(3000); return; } // nada disponível no momento

    // foto nova na frente; senão segue a rotação
    var id = null;
    while (priority.length > 0 && id === null) {
      var cand = priority.shift();
      if (disponivel(cand) && !known[cand].video) id = cand;
    }
    if (id === null) id = fotosOk[fotoIdx % fotosOk.length];
    fotoIdx++;

    var item = known[id] || {};
    var img = new Image();
    img.onload = function () {
      contadorFotos++;
      mostrarFoto(img.src, item.handle || '');
      agendar(SEG_FOTO);
      prefetchProximaFoto();
    };
    img.onerror = function () {
      indisponiveis[id] = Date.now() + 60000; // pula esta foto por 1 min
      agendar(400);
    };
    img.src = urlFoto(id);
  }

  function trocar(preparar, handle) {
    var show = document.getElementById(activeA ? 'layerB' : 'layerA');
    var hide = document.getElementById(activeA ? 'layerA' : 'layerB');
    preparar(show.getElementsByClassName('pic')[0], show.getElementsByTagName('video')[0], show.getElementsByClassName('bg')[0]);
    var legendaEl = show.getElementsByClassName('handle')[0];
    legendaEl.textContent = handle ? '⛄ ' + handle + ' ⛄' : ''; // legenda com boneco de neve
    emojiImg(legendaEl);
    show.className = 'layer visible';
    hide.className = 'layer';
    activeA = !activeA;
    // depois da transição, descarrega o vídeo da camada que saiu
    setTimeout(function () {
      var v = hide.getElementsByTagName('video')[0];
      if (v) {
        v.pause();
        v.removeAttribute('src'); // o blob fica no cache para reuso
        v.load();
        v.style.display = 'none';
      }
    }, 1600);
  }

  function mostrarFoto(url, handle) {
    trocar(function (pic, vid, bg) {
      vid.style.display = 'none';
      bg.style.display = 'block';
      bg.style.backgroundImage = 'url("' + url + '")'; // mesma foto borrada preenchendo a tela
      pic.style.display = 'block';
      pic.style.backgroundImage = 'url("' + url + '")';
      // reinicia o Ken Burns (zoom suave) nesta foto
      pic.className = 'pic';
      void pic.offsetWidth; // força reflow para a animação rodar de novo
      pic.style.animationDuration = (SEG_FOTO + 1500) + 'ms';
      pic.className = 'pic kb';
    }, handle);
  }

  function mostrarVideo(id, handle) {
    // já baixado nesta sessão? toca direto do cache
    if (cacheVideos[id]) {
      tocarVideo(cacheVideos[id], handle);
      return;
    }
    // baixa o vídeo inteiro primeiro (são curtos) — streaming direto trava no player
    var x = new XMLHttpRequest();
    x.open('GET', urlVideo(id));
    x.timeout = 45000; // Apps Script pode levar alguns segundos
    function falhou() {
      indisponiveis[id] = Date.now() + 120000; // pula este vídeo por 2 min
      agendar(400);
    }
    x.onload = function () {
      try {
        var r = JSON.parse(x.responseText);
        if (!r.ok || !r.data) { falhou(); return; }
        // converte base64 -> blob
        var bin = atob(r.data);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var blob = new Blob([bytes], { type: r.mime || 'video/mp4' });
        cacheVideos[id] = URL.createObjectURL(blob); // guarda pro resto da sessão
        tocarVideo(cacheVideos[id], handle);
      } catch (e) {
        falhou();
      }
    };
    x.onerror = falhou;
    x.ontimeout = falhou;
    x.send();
    agendar(55000); // segurança: se o download travar, avança
  }

  function tocarVideo(url, handle) {
    trocar(function (pic, vid, bg) {
      bg.style.display = 'none';
      pic.className = 'pic'; // tira o Ken Burns no vídeo
      pic.style.display = 'none';
      pic.style.backgroundImage = '';
      vid.style.display = 'block';
      vid.onended = function () { agendar(300); };
      vid.onerror = function () { agendar(500); };
      vid.muted = false; // tenta com som
      vid.src = url;
      var p = vid.play();
      if (p && p.catch) {
        p.catch(function () {
          // navegador bloqueou autoplay com som -> toca sem som
          vid.muted = true;
          vid.play();
        });
      }
      // garantia: se ainda estiver parado depois de 1s, força mudo e toca
      setTimeout(function () {
        if (vid.paused) {
          vid.muted = true;
          vid.play();
        }
      }, 1000);
    }, handle);
    agendar(MAX_VIDEO); // segurança caso o vídeo trave
  }

  function poll() {
    var x = new XMLHttpRequest(); // XHR: compatível com navegadores antigos de Smart TV
    x.open('GET', API_URL);
    x.onload = function () {
      try { onPhotos(JSON.parse(x.responseText)); } catch (e) {}
    };
    x.send();
  }

  // toque inicial: autoplay de vídeo COM SOM exige 1 interação do usuário.
  // o operador toca uma vez ao montar a TV e o áudio fica liberado pela sessão.
  document.getElementById('start').addEventListener('click', function () {
    iniciado = true;
    this.style.display = 'none';
    if (firstLoad && (fotos.length > 0 || videos.length > 0)) {
      firstLoad = false;
      document.getElementById('msg').style.display = 'none';
      showNext();
    }
  });

  poll();
  setInterval(poll, SEG_ATUALIZA);
</script>
</body>
</html>
