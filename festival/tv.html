<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV — Festival de Inverno</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  .layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    -webkit-transition: opacity 1.5s ease-in-out;
  }
  .layer .pic {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-position: center; background-size: contain; background-repeat: no-repeat;
  }
  .layer .handle {
    position: absolute; bottom: 76px; left: 0; width: 100%;
    text-align: center; color: #fff;
    font-family: 'Quicksand', Arial, Helvetica, sans-serif;
    font-size: 30px; font-weight: 600; letter-spacing: 0.5px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.95);
  }
  .visible { opacity: 1; }
  #brand {
    position: absolute; top: 24px; left: 30px; z-index: 10;
    text-align: center; pointer-events: none;
  }
  #brand img {
    display: block; width: 210px; opacity: 0.88; margin: 0 auto 8px;
  }
  #titulo {
    color: #fff; font-size: 30px; font-weight: bold;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  #qr {
    position: absolute; top: 24px; right: 24px; z-index: 10;
    background: rgba(255,255,255,0.95); border-radius: 12px;
    padding: 10px; text-align: center;
  }
  #qr img { display: block; width: 170px; height: 170px; }
  #qr div {
    font-size: 15px; color: #0b1b3a; margin-top: 6px;
    font-weight: bold; letter-spacing: 1px;
  }
  #msg {
    position: absolute; top: 50%; left: 0; width: 100%;
    text-align: center; color: #999; font-size: 28px; margin-top: -20px;
  }
  /* emojis como imagem (mesmo visual em qualquer TV) */
  img.emoji {
    height: 1.1em; width: 1.1em;
    margin: 0 0.15em; vertical-align: -0.15em;
    display: inline-block;
  }
</style>
</head>
<body>
  <div id="layerA" class="layer"><div class="pic"></div><div class="handle"></div></div>
  <div id="layerB" class="layer"><div class="pic"></div><div class="handle"></div></div>
  <div id="brand">
    <img id="logomarca" src="logo-marca.png" alt="">
    <div id="titulo"></div>
  </div>
  <div id="qr"><img id="qrimg" alt="QR"><div>ENVIE SUA FOTO &#128247;</div></div>
  <div id="msg">Aguardando fotos...</div>

<script src="config.js"></script>
<script>
  document.getElementById('titulo').innerHTML = '&#10052;&#65039; ' + TITULO;
  document.getElementById('qrimg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=460x460&data=' + encodeURIComponent(SITE_URL);

  // troca emojis por imagens (Twemoji) — mesmo visual em qualquer navegador/TV
  function emojiImg(el) {
    if (window.twemoji) {
      twemoji.parse(el, { folder: 'svg', ext: '.svg' });
    }
  }
  emojiImg(document.getElementById('titulo'));
  emojiImg(document.getElementById('qr'));

  var SEG_FOTO = SEGUNDOS_POR_FOTO * 1000;       // valor em segundos vem do config.js
  var SEG_ATUALIZA = INTERVALO_ATUALIZACAO * 1000; // valor em segundos vem do config.js

  var known = {};      // id -> @handle
  var playlist = [];   // ordem normal de exibição
  var priority = [];   // fotos novas: passam na frente
  var idx = 0;
  var firstLoad = true;
  var activeA = true;

  function urlFor(id) {
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1920';
  }

  function onPhotos(photos) {
    var current = {};
    for (var i = 0; i < photos.length; i++) {
      var p = photos[i];
      current[p.id] = true;
      if (!(p.id in known)) {
        known[p.id] = p.handle || '';
        if (!firstLoad) priority.push(p.id);
        playlist.push(p.id);
      }
    }
    // remove fotos apagadas da pasta
    playlist = playlist.filter(function (id) { return current[id]; });
    priority = priority.filter(function (id) { return current[id]; });

    if (firstLoad && playlist.length > 0) {
      firstLoad = false;
      document.getElementById('msg').style.display = 'none';
      showNext();
    }
  }

  function showNext() {
    if (playlist.length === 0) { setTimeout(showNext, 3000); return; }
    var id = priority.length > 0 ? priority.shift() : playlist[idx++ % playlist.length];
    var img = new Image();
    img.onload = function () {
      swapTo(img.src, known[id] || '');
      setTimeout(showNext, SEG_FOTO);
    };
    img.onerror = function () { setTimeout(showNext, 500); }; // pula foto com erro
    img.src = urlFor(id);
  }

  function swapTo(url, handle) {
    var show = document.getElementById(activeA ? 'layerB' : 'layerA');
    var hide = document.getElementById(activeA ? 'layerA' : 'layerB');
    show.getElementsByClassName('pic')[0].style.backgroundImage = 'url("' + url + '")';
    var legendaEl = show.getElementsByClassName('handle')[0];
    legendaEl.textContent = handle ? '⛄ ' + handle + ' ⛄' : ''; // legenda com boneco de neve
    emojiImg(legendaEl);
    show.className = 'layer visible';
    hide.className = 'layer';
    activeA = !activeA;
  }

  function poll() {
    var x = new XMLHttpRequest(); // XHR: compatível com navegadores antigos de Smart TV
    x.open('GET', API_URL);
    x.onload = function () {
      try { onPhotos(JSON.parse(x.responseText)); } catch (e) {}
    };
    x.send();
  }

  poll();
  setInterval(poll, SEG_ATUALIZA);
</script>
</body>
</html>
